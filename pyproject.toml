[project]
name = "d94-app-ayaan"
version = "0.1.0"
description = "AI CLI 작업 오케스트레이션 서비스"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "py-eureka-client>=0.11,<1",
  "pyjwt>=2.9,<3",
  "croniter>=5,<7",
]

[project.scripts]
ayaan-hook = "ayaan.hook:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.setuptools]
packages = ["ayaan"]

[tool.setuptools.package-data]
ayaan = ["fake_fixtures/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
